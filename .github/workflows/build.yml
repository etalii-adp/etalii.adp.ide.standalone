# The repository's gates, automated (github-build-pipeline spec). Every step runs the exact
# command a person runs locally - CLAUDE.md defines them - and every step is judged by its
# exit code, never by grepping output: a zero-test run exits 5 and FAILS here, because in this
# repository "Zero tests ran" has always meant a broken build, not an empty suite.
name: Build

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# Release runs serialise rather than overlap (contracts-and-build-hygiene Requirement 3). Two
# runs publishing at once is how one commit came to carry two version numbers.
#
# cancel-in-progress is false ON PURPOSE: a run cancelled between `gh release create` and its
# asset upload leaves a tag with no ZIP behind it, which is worse than a queued run. The group
# is keyed on the ref, so pull-request checks are untouched.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0, not the default shallow clone: Nerdbank.GitVersioning computes the
      # version from git height, and a shallow clone is the classic silently-wrong-version
      # mistake - NB.GV fails loudly on one, which is this line's whole justification.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      # NuGet, cached on the central version manifest - the one file every package version
      # goes through in this repository.
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props', 'src/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install client dependencies
        working-directory: src
        run: npm ci

      # The four gates, verbatim and separate, so a red run names the gate that failed.
      # No retries anywhere: the known teardown flakes are Windows file-lock races and this
      # runner is Linux - if a flake reproduces here, it should be seen, not hidden.
      - name: Backend tests
        working-directory: src/backend
        run: dotnet test --solution EtAlii.Adp.slnx

      - name: Backend style gate
        working-directory: src/backend
        run: dotnet format style --verify-no-changes --severity info

      - name: Client tests
        working-directory: src/client
        run: npm test

      - name: Client typecheck
        working-directory: src/client
        run: npm run typecheck

  release:
    # Publishing is the merge's reward: pull requests gate only (Requirement 4.3).
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: src/global.json

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props', 'src/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Compute the version
        id: version
        run: |
          dotnet tool install --global nbgv
          echo "semver=$(nbgv get-version --variable SemVer2)" >> "$GITHUB_OUTPUT"

      # A published asset is never overwritten (Requirement 4.5): a re-run of an
      # already-published commit fails here, loudly, and the gate job's result stands.
      #
      # TWO questions, because the first one alone let f5a755c1 publish three times under three
      # names and 8dfb7f64 twice under two. A version string that is already taken is one way to
      # republish; the same commit under a fresh number is the other, and only the second check
      # sees it.
      #
      # The commit check matches the sha anywhere in the tag listing rather than dereferencing a
      # named ref. `git ls-remote --tags` prints the peeled `refs/tags/x^{}` entry beside an
      # annotated tag, so this covers annotated and lightweight alike. Every tag on origin today
      # is lightweight - confirmed with `git cat-file -t`, all seven resolving straight to
      # `commit` - but a guard that only works for one tag shape would pass on precisely the case
      # it exists to catch, and would do it silently.
      - name: Refuse to republish
        run: |
          semver="${{ steps.version.outputs.semver }}"
          if git ls-remote --tags origin "refs/tags/v$semver" | grep -q .; then
            echo "::error::v$semver is already published - not overwriting a released asset."
            exit 1
          fi
          already=$(git ls-remote --tags origin | grep "^${{ github.sha }}" || true)
          if [ -n "$already" ]; then
            echo "::error::${{ github.sha }} is already released as: $already"
            exit 1
          fi

      # A queued run whose commit is no longer the tip does not publish (Requirement 3.2). The
      # run stays GREEN: being overtaken is not a failure, and a red run here would teach
      # everyone to ignore red runs.
      #
      # A behaviour change, stated rather than smuggled: a burst of five pushes now produces one
      # release rather than five. An intermediate commit gets no release of its own; pushing it
      # alone is how to give it one.
      - name: Skip a superseded commit
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/develop | cut -f1)
          if [ "$tip" != "${{ github.sha }}" ]; then
            echo "::notice::${{ github.sha }} is no longer the tip of develop ($tip); not publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install client dependencies
        if: steps.tip.outputs.publish == 'true'
        working-directory: src
        run: npm ci

      - name: Build the client
        if: steps.tip.outputs.publish == 'true'
        working-directory: src/client
        run: npm run build

      # Framework-dependent and platform-neutral: one ZIP for every OS, at the price of a
      # .NET 10 runtime on the target machine - the design's recorded trade-off. The client's
      # production build lands in wwwroot/, which is exactly what MapClientApp's production
      # mode (no Client:DevServerUrl configured) serves.
      #
      # No copy step: the service project's own PublishClientApp target already places
      # client/dist into wwwroot/. A `cp -r src/client/dist publish/wwwroot` on top of that
      # copied the bundle INTO the existing directory - shipping every release with a second,
      # unreachable copy at wwwroot/dist/ - because cp treats an existing destination as a
      # parent. Verified against a real publish: wwwroot/ comes out with index.html,
      # favicon.svg and assets/ before anything is copied.
      - name: Publish the service
        if: steps.tip.outputs.publish == 'true'
        run: dotnet publish src/backend/EtAlii.Adp.Backend.Service -c Release -o publish

      # Refuses to release a build carrying the developer sign-in bypass
      # (developer-sign-in-bypass Requirement 2.3). It runs before the ZIP, so a build that
      # fails here is never packaged, let alone published.
      #
      # This is deliberately not a unit test, and that is the whole point of it. The test
      # assembly compiles Debug, where the bypass exists by design, so a test asserting its
      # absence would assert either the wrong thing or a configuration default and would pass
      # whether or not a release were safe. This step reads a different input - the
      # Release-compiled artifact a user actually runs.
      #
      # It also does not grep for "DeveloperSession", because that string is in every build
      # including correct ones: the RPC is declared unconditionally in authentication.proto,
      # so the serialized descriptor carries the name and the generated service base carries a
      # virtual that answers Unimplemented. Measured on a real publish - the bare name is
      # present in Debug AND Release, while the exemption literal is present only in Debug. A
      # text search would therefore fail on a correct release, and the usual way to quiet a
      # guard that cries wolf is to loosen it until it never fires again.
      #
      # Seen to fail before being trusted: run against a deliberately Debug-published output it
      # exits 1 and names both the handler and the exemption; against the Release output it
      # exits 0.
      - name: Refuse to release a build carrying the developer sign-in bypass
        if: steps.tip.outputs.publish == 'true'
        run: dotnet run --project .github/tools/developer-session-guard -c Release -- publish/EtAlii.Adp.Backend.dll

      - name: Write the release readme
        if: steps.tip.outputs.publish == 'true'
        run: |
          cat > publish/readme.md <<EOF
          # EtAlii.Adp ${{ steps.version.outputs.semver }}

          Built from commit ${{ github.sha }}.

          To run (requires the .NET 10 runtime):

              dotnet EtAlii.Adp.Backend.Service.dll

          then browse to the address it logs. Before the first login, set a username and
          credential under "LocalAuthenticator" in appsettings.json - the shipped values are
          deliberately empty.
          EOF

      - name: Zip
        if: steps.tip.outputs.publish == 'true'
        run: |
          cd publish
          zip -qr "../EtAlii.Adp-${{ steps.version.outputs.semver }}.zip" .

      # gh is preinstalled on the runner; no third-party release action, no extra supply
      # chain, only the built-in token (Requirement 4.4).
      - name: Publish the release
        if: steps.tip.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target, so the tag is created ON the commit that was built. Without it gh
          # resolves the tag against the repository's DEFAULT BRANCH at API time, which is
          # how three tags landed on f5a755c1 and two on 8dfb7f64.
          gh release create "v${{ steps.version.outputs.semver }}" \
            "EtAlii.Adp-${{ steps.version.outputs.semver }}.zip" \
            --target "${{ github.sha }}" \
            --title "EtAlii.Adp ${{ steps.version.outputs.semver }}" \
            --generate-notes

      # What the fix claims, checked against the remote rather than assumed. Two of the four
      # places in tests.md's "one build, one number, four places" are enforced here - the tag's
      # commit and the version the assemblies carry; the ZIP's file name and the login line
      # inside the running app still need a person.
      - name: The tag names the commit it was built from
        if: steps.tip.outputs.publish == 'true'
        run: |
          tagged=$(git ls-remote origin "refs/tags/v${{ steps.version.outputs.semver }}" | cut -f1)
          if [ "$tagged" != "${{ github.sha }}" ]; then
            echo "::error::v${{ steps.version.outputs.semver }} points at $tagged, not at ${{ github.sha }}."
            exit 1
          fi
