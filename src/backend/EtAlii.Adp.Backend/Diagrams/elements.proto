syntax = "proto3";

package etalii.adp;

import "connection.proto";
import "google/protobuf/any.proto";

option csharp_namespace = "EtAlii.Adp";

message ElementId {
  string value = 1;
}

message Element {
  ElementId id = 1;
  Point2D position = 2;            // Point2D from connection.proto
  string type = 3;                 // mime-style, e.g. "mindmap/node"
  google.protobuf.Any payload = 4; // type-specific message, defined per diagram module
}

// Ordered path segments. The leading segments resolve to a file within
// the workspace; any additional segments address a location/sub-scope
// within that file.
message Path {
  repeated string segments = 1;
}

message Point2D {
  double x = 1;
  double y = 2;
}

message BoundingBox {
  Point2D min = 1;
  Point2D max = 2;
}

message ViewUpdate {
  Point2D center = 1;
  BoundingBox bounding_box = 2;
}
