ded: "0.3"
designer: etalii/knowledge
id: r4g7m1zx
# Regions, written for ADP: the side of a two-way relation that holds the values, and a view grouped by it.
name: Regions
activeView: g-by-country
properties:
  - id: g-name
    name: Name
    type: text
    title: true
  - id: g-country
    name: Country
    type: relation
    target: $c8r2n5vw@countries.yaml
    limit: one
    backlinkName: Regions
  - id: g-neighbour
    name: Borders on
    type: relation
    target: $c8r2n5vw@countries.yaml
views:
  - id: g-by-country
    name: By country
    groupBy: g-country
  - id: g-all
    name: All regions
rows:
  - id: friesland
    cells:
      - property: g-name
        text: Friesland
      - property: g-country
        rows:
          - row: $c8r2n5vw@countries.yaml#nl.Name=Netherlands
  - id: limburg-nl
    cells:
      - property: g-name
        text: Limburg
      - property: g-country
        rows:
          - row: $c8r2n5vw@countries.yaml#nl.Name=Netherlands
      - property: g-neighbour
        rows:
          - row: $c8r2n5vw@countries.yaml#be.Name=Belgium
  - id: flanders
    cells:
      - property: g-name
        text: Flanders
      - property: g-country
        rows:
          - row: $c8r2n5vw@countries.yaml#be.Name=Belgium
      - property: g-neighbour
        rows:
          - row: $c8r2n5vw@countries.yaml#nl.Name=Netherlands
  - id: kansai
    cells:
      - property: g-name
        text: Kansai
      - property: g-country
        rows:
          - row: $c8r2n5vw@countries.yaml#jp.Name=Japan
