syntax = "proto3";

package etalii.adp.rdf;

option csharp_namespace = "EtAlii.Adp.Diagram.Rdf";

// The payloads of the RDF family's elements, packed into the core Element's Any. Defined in the
// module's own api folder; no core proto is edited to add them, and there are no new services or
// streams - the elements ride the existing Element/Delta shapes.
//
// The display forms travel beside the identities: the canvas shows prefixed names the way the
// author's prefixes spell them, while ids and edits key off the full IRIs.

// One drawn resource - a card of the data graph (Requirement 3).
message RdfResourcePayload {
  // The full IRI; empty for a blank node, whose identity is this parse's alone.
  string iri = 1;

  // What the card is titled: a prefixed name, the IRI's local name, or a _:label.
  string display = 2;

  // The prefixed names of the resource's rdf:type triples, badge order (Requirement 3.3).
  // Named type_badges rather than types because protobuf's own nested Types class claims that
  // property name in the generated C#.
  repeated string type_badges = 3;

  // The literal-valued properties, rendered as rows inside the card, never as nodes
  // (Requirement 3.2).
  repeated RdfLiteralRow rows = 4;

  // True for a blank node: drawn, but refusing positions and edits per the identity boundary
  // (Requirements 3.4, 4.5).
  bool blank = 5;
}

// One literal property row inside a resource card.
message RdfLiteralRow {
  // The predicate, display form.
  string predicate = 1;

  // The value's lexical form.
  string value = 2;

  // The row's annotation: a language tag with its '@', or a prefixed datatype - empty for a
  // plain string.
  string annotation = 3;
}

// One edge - a triple between two drawn terms. The endpoints ride here because a connection
// travels as an element and the canvas redraws its line from its endpoints' cards.
message RdfEdgePayload {
  string from_element_id = 1;
  string to_element_id = 2;

  // The predicate, display form, drawn as the edge's label.
  string predicate = 3;

  // The predicate's full IRI, which edits key off.
  string predicate_iri = 4;
}

// The truncation banner's facts, riding one element when the drawn-element budget cut a large
// graph down to its first N (Requirement 8.2).
message RdfTruncationPayload {
  int32 shown = 1;
  int32 total = 2;
}

// ---------------------------------------------------------------------------------------------
// The ontology reading's payloads (owl-diagram design, Data Models). Same family, same file:
// the w3c/owl definition packs these into the same Element/Delta shapes.

// One drawn ontology element that is not an expression (owl-diagram Requirement 1).
message OwlNodePayload {
  // What the node draws as: class | datatype | individual | thing | ontology | operator |
  // restriction - the canvas styles by this, shape first, color second.
  string kind = 1;

  // The full IRI; empty for expression nodes and materialized Thing/Literal anchors.
  string iri = 2;

  // The label: rdfs:label preferred, prefixed name as fallback (Requirement 1.4).
  string display = 3;

  // Type badges on an individual card; empty elsewhere.
  repeated string badges = 4;

  // Annotation and literal-assertion rows - the family card convention reused.
  repeated RdfLiteralRow rows = 5;

  // Drawn dimmed: owl:deprecated true (Requirement 1.6).
  bool deprecated = 6;

  // Drawn dimmed: used here, declared nowhere in this file (Requirement 1.6).
  bool external = 7;
}

// One drawn axiom or assertion (owl-diagram Requirement 2).
message OwlEdgePayload {
  // subclass | equivalent | disjoint | object-property | datatype-property | assertion |
  // expression - what the canvas styles the line by.
  string kind = 1;

  string from_element_id = 2;
  string to_element_id = 3;

  // A property's display with its characteristic words folded in; empty for pure axiom edges.
  string label = 4;

  // The property's full IRI for property and assertion edges; the axiom predicate's otherwise.
  string property_iri = 5;
}

// One class-expression node - blank-node-rooted, structural-id-addressed, canvas-read-only
// (owl-diagram Requirement 3).
message OwlExpressionPayload {
  // The Manchester-style label, depth-capped at two expression levels.
  string label = 1;

  // True when deeper structure was cut to the visible ellipsis; the full text is one selection
  // away in the property grid (Requirement 3.4).
  bool elided = 2;

  // True for a structurally broken expression - drawn as a marked problem node (Requirement 3.5).
  bool malformed = 3;

  // The element id of the named class whose axiom attaches this expression.
  string owner_element_id = 4;

  // restriction | operator - the compact shape the canvas draws.
  string kind = 5;
}
