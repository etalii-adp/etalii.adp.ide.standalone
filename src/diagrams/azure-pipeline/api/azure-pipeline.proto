syntax = "proto3";

package etalii.adp.azurepipeline;

option csharp_namespace = "EtAlii.Adp.Diagram.AzurePipeline";

// The Azure Pipelines wire payload. It rides inside the core Element's `Any`; nothing in the
// core contract is extended for it (azure-pipeline-diagram Requirement 11.2).

// What an element is. The canvas draws each differently: a stage is a container, a deployment
// job carries its environment, an edge is an arrow rather than a box.
enum PipelineElementKindProto {
  PIPELINE_ELEMENT_KIND_UNSPECIFIED = 0;
  PIPELINE_ELEMENT_KIND_STAGE = 1;
  PIPELINE_ELEMENT_KIND_JOB = 2;
  PIPELINE_ELEMENT_KIND_DEPLOYMENT_JOB = 3;
  PIPELINE_ELEMENT_KIND_STEP = 4;
  PIPELINE_ELEMENT_KIND_EDGE = 5;
  PIPELINE_ELEMENT_KIND_TEMPLATE = 6;
}

// Which outcome of what it waits for lets an element run. An edge that only fires on failure is
// a different arrow from one that fires on success, and a pipeline file is bad at showing that.
//
// ON_SUCCESS is zero because it is the schema's default: an element with no condition at all
// waits for success, so an unset field already means the right thing.
enum PipelineEdgeConditionProto {
  PIPELINE_EDGE_CONDITION_ON_SUCCESS = 0;
  PIPELINE_EDGE_CONDITION_ALWAYS = 1;
  PIPELINE_EDGE_CONDITION_ON_FAILURE = 2;
  // succeededOrFailed(): runs whether or not it succeeded, but not if the run was cancelled.
  // Distinct from ALWAYS, which is the entire reason both exist.
  PIPELINE_EDGE_CONDITION_ON_SUCCESS_OR_FAILURE = 3;
  // A condition this module will not interpret; `condition` carries it verbatim for the reader.
  PIPELINE_EDGE_CONDITION_CUSTOM = 4;
}

// One element of a pipeline diagram.
message PipelineElementPayload {
  // The stage or job name as the file wrote it - which is also what a dependsOn names. Empty for
  // an element the schema implied rather than the file declaring, and for a step, which has none.
  string name = 1;
  // What to show: the displayName, or the kind's own identifying value where there is none.
  string display_name = 2;
  PipelineElementKindProto kind = 3;
  // The `condition` verbatim; empty when absent. An expression is never evaluated here.
  string condition = 4;
  // Its presence or its ordering is decided by an expression - a stage inside a `${{ if }}`, or a
  // job multiplied by a matrix whose size is not known until the run starts. Drawn to say so
  // rather than drawn as certain.
  bool indeterminate = 5;
  // Its text lives in another file, so it is read-only here (Requirement 5.4).
  bool from_template = 6;
  // The template that contributed it, workspace-relative; set when from_template.
  string template_path = 7;
  // False only when the file says `enabled: false` outright. An expression leaves this true,
  // because drawing a step as skipped when it in fact runs is the worse mistake.
  bool enabled = 8;
  // How many of it will run: 1, or what a matrix or parallel strategy produces.
  int32 multiplicity = 9;
  // EDGE only: what is waited for, and what waits.
  string source_id = 10;
  string target_id = 11;
  PipelineEdgeConditionProto edge_condition = 12;
  // EDGE only: the file did not say so - a stage with no dependsOn waits for the one declared
  // before it. The single most easily missed thing about an Azure pipeline, so the arrow is drawn
  // differently from one somebody wrote down.
  bool implicit_dependency = 13;
  // EDGE only: it names a stage or job that does not exist. Kept and drawn broken rather than
  // dropped, because a dangling dependency is what this diagram is for (Requirement 6.5).
  bool broken = 14;
  // How big the backend measured it, so the canvas draws a container at the size its contents
  // actually need rather than guessing.
  double width = 15;
  double height = 16;
  // Where it runs, after the schema's pool inheritance - and whether it was inherited, which
  // tells a reader that changing it means editing a different element.
  string pool = 17;
  bool pool_inherited = 18;
  // A deployment job's environment, and the strategy that decides its lifecycle hooks.
  string environment = 19;
  string strategy = 20;
  // For a step inside a deployment job, the lifecycle hook it belongs to.
  string hook = 21;
  // TEMPLATE only: the reference as written, and why it was not followed. An empty reason means
  // it was followed; a diagram that quietly drops a template is worse than one admitting the gap.
  string reference = 22;
  string unresolved_reason = 23;
  // The stage or job this element sits in; empty at the top level.
  string parent_id = 24;
  // Where its text is, so a double-click can open the file at the right place. 1-based, and 0
  // when this element has no text of its own.
  int32 first_line = 25;
  int32 last_line = 26;
  // STAGE only: how many jobs it holds. A collapsed stage sends no jobs, and Requirement 8.2 asks
  // it to show its name and its job count - so the count has to travel on the stage, or a
  // collapsed one would have nothing to count.
  int32 job_count = 27;
}
