syntax = "proto3";

package etalii.adp;

import "shared.proto"; // ShortGuid
import "context.proto"; // ContextScope, ContextSource, ContextShortcut, ContextActionGroup, ContextPrompt

option csharp_namespace = "EtAlii.Adp";

service HierarchyService {
  rpc ListEntries(ListEntriesRequest) returns (ListEntriesResponse);
  rpc WatchHierarchy(WatchHierarchyRequest) returns (stream HierarchyMessage);

  // Context actions. gRPC-Web offers no client-streaming or bidi from a browser, so
  // the client->backend leg of each interaction is a unary call correlated by
  // watch_id/interaction_id, while the backend->client leg (prompts) rides the
  // WatchHierarchy stream this connection already has open.
  rpc DiscoverActions(DiscoverActionsRequest) returns (DiscoverActionsResponse);
  rpc ExecuteAction(ExecuteActionRequest) returns (ExecuteActionResponse);
  rpc ProposeInput(ProposeInputRequest) returns (ProposeInputResponse);
  rpc SubmitInteraction(SubmitInteractionRequest) returns (SubmitInteractionResponse);
  rpc CancelInteraction(CancelInteractionRequest) returns (CancelInteractionResponse);
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  FILE = 1;
  FOLDER = 2;
}

message Entry {
  ShortGuid id = 1;
  ShortGuid parent_id = 2; // unset for a root-level entry
  string name = 3;
  EntryKind kind = 4;
  bool available = 5; // false when a listed folder becomes inaccessible (permissions, deletion)
  bool has_children = 6; // for a folder: whether it currently has any entry inside it; always false for a file
}

message ListEntriesRequest {
  ShortGuid project_id = 1;
  ShortGuid folder_id = 2; // unset = list the root folder's direct children
  ShortGuid watch_id = 3;  // client-generated; scopes this call to one connection's HierarchyModel (never shared across connections)
}

message ListEntriesError {
  string message = 1;
}

message Entries {
  repeated Entry entries = 1;
}

message ListEntriesResponse {
  oneof result {
    Entries entries = 1;
    ListEntriesError error = 2;
  }
}

message WatchHierarchyRequest {
  ShortGuid project_id = 1;
  ShortGuid watch_id = 2; // same client-generated id used on this connection's ListEntries calls
}

message EntryCreated {
  Entry entry = 1; // parent_id/name/kind resolved from the model
}

message EntryRemoved {
  ShortGuid entry_id = 1;
}

message EntryRenamed {
  ShortGuid entry_id = 1;
  string new_name = 2;
}

message EntryUpdated {
  ShortGuid entry_id = 1;
  bool has_children = 2; // pushed when an existing, already-known folder's has_children changes
}

message RootUnavailable {
  string message = 1;
}

message HierarchyChange {
  oneof change {
    EntryCreated created = 1;
    EntryRemoved removed = 2;
    EntryRenamed renamed = 3;
    RootUnavailable root_unavailable = 4;
    EntryUpdated updated = 5;
  }
}

// The stream carries both hierarchy deltas and backend-initiated prompts;
// HierarchyChange itself is unchanged, only wrapped.
message HierarchyMessage {
  oneof message {
    HierarchyChange change = 1;
    ContextPrompt prompt = 2;
  }
}

message DiscoverActionsRequest {
  ShortGuid project_id = 1;
  ShortGuid watch_id = 2;
  ContextScope scope = 3;
  ContextSource source = 4;
}

message DiscoverActionsResponse {
  repeated ContextActionGroup groups = 1;
}

message ExecuteActionRequest {
  ShortGuid project_id = 1;
  ShortGuid watch_id = 2;
  ContextScope scope = 3;
  ContextSource source = 4;
  ShortGuid interaction_id = 5; // client-generated; correlates the pushed prompt back to this call
  oneof trigger {
    string action_id = 6;
    ContextShortcut shortcut = 7;
  }
}

message ExecuteActionResponse {
  bool accepted = 1;
  string error = 2;
}

message ProposeInputRequest {
  ShortGuid interaction_id = 1;
  uint32 revision = 2;
  string value = 3;
}

message ProposeInputResponse {
  uint32 revision = 1; // echoed, so the client can discard a verdict for text it has moved past
  bool valid = 2;
  string reason = 3;
}

message SubmitInteractionRequest {
  ShortGuid interaction_id = 1;
  string value = 2;
}

message SubmitInteractionResponse {
  bool completed = 1;
  string error = 2;
}

message CancelInteractionRequest {
  ShortGuid interaction_id = 1;
}

message CancelInteractionResponse {}
