syntax = "proto3";

package etalii.adp;

option csharp_namespace = "EtAlii.Adp.Authentication.Wire";

service AuthenticationService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // What the running product is - its version, principally - asked by the login page before
  // any session exists, which is why it lives on this service: the one surface reachable
  // without a token (github-build-pipeline Requirements 2.3, 3.2). The answer comes from the
  // backend's own Nerdbank.GitVersioning-stamped assembly, so the login panel, the
  // assemblies, and the release ZIP can never disagree about the version.
  rpc DescribeProduct(DescribeProductRequest) returns (DescribeProductResponse);

  // A session for a locally running developer build, obtained without a credential
  // (developer-sign-in-bypass Requirement 1.1). Asked once by the client on mount, before it
  // decides whether to render the sign-in form.
  //
  // **The implementation of this method is compiled only into a Debug build**, together with
  // its entry in SessionInterceptor.IsExempt. This declaration is the contract and is
  // generated into every build, because a service's methods cannot be split across proto
  // files - but a released build has no override for it and no exemption, so the call is
  // refused for want of a session before it could reach the unimplemented base. That is two
  // independent reasons it cannot mint anything, and it is what the release job's guard
  // checks: the absence of the *implementation*, not of this line.
  rpc DeveloperSession(DeveloperSessionRequest) returns (DeveloperSessionResponse);
}

message DescribeProductRequest {}

message DescribeProductResponse {
  // AssemblyInformationalVersion: semver plus git height, commit id embedded.
  string version = 1;
}

message LoginRequest {
  string username = 1;
  string credential = 2; // opaque; local mode may treat this as a plain password
}

message SessionToken {
  string value = 1;
}

message LoginError {
  string message = 1;
}

message LoginResponse {
  oneof result {
    SessionToken session = 1;
    LoginError error = 2;
  }
}

message LogoutRequest {
  SessionToken session = 1;
}

message LogoutResponse {}

message DeveloperSessionRequest {}

// A token, or nothing at all. Nothing is the ordinary answer everywhere the bypass is not
// compiled in, is not running under Development, or has been turned off locally - and the
// client treats all three the same way, by falling through to the sign-in form.
message DeveloperSessionResponse {
  oneof result {
    SessionToken session = 1;
  }
  // True only alongside a session issued by the bypass. The client shows its marker from
  // this - from the session rather than from a build constant - so a released build cannot
  // render the marker and a bypassed session cannot fail to (Requirement 5.1).
  bool bypassed = 2;
}
