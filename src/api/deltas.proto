syntax = "proto3";

package etalii.adp;

import "elements.proto";

option csharp_namespace = "EtAlii.Adp.Diagram.Wire";

message Add {
  repeated Element elements = 1;
}

message Remove {
  repeated ElementId element_ids = 1;
}

message Group {
  repeated ElementId source_element_ids = 1;
  Element group_element = 2;
}

message Ungroup {
  ElementId group_element_id = 1;
  repeated Element elements = 2;
}

message Delta {
  oneof action {
    Add add = 1;
    Remove remove = 2;
    Group group = 3;
    Ungroup ungroup = 4;
  }
}
