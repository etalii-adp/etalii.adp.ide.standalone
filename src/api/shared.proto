syntax = "proto3";

package etalii.adp;

// A dedicated namespace, distinct from the domain namespace "EtAlii.Adp" the
// other generated messages share, because EtAlii.Adp itself already defines
// a ShortGuid type (src/backend/EtAlii.Adp/ShortGuid.cs) that this message is
// the wire representation of.
option csharp_namespace = "EtAlii.Adp.Common.Wire";

// The raw 16-byte representation of a System.Guid (EtAlii.Adp.ShortGuid);
// the base36 string form is a display/URL concern, not a wire concern.
message ShortGuid {
  bytes value = 1;
}
