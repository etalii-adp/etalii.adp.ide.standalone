syntax = "proto3";

package etalii.adp;

import "connection.proto";
import "shared.proto";

option csharp_namespace = "EtAlii.Adp";

service ProjectService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc AddProject(AddProjectRequest) returns (AddProjectResponse);
  rpc RemoveProject(RemoveProjectRequest) returns (RemoveProjectResponse);
}

message Project {
  ShortGuid id = 1;
  string name = 2;
  Path path = 3;
  string display_path = 4; // path.segments joined and middle-truncated for tile display
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message AddProjectRequest {
  Path path = 1; // plain-text folder path entry, per Requirement 5.2
  string name = 2;
}

message AddProjectError {
  string message = 1;
}

message AddProjectResponse {
  oneof result {
    Project added = 1;
    AddProjectError error = 2;
  }
}

message RemoveProjectRequest {
  ShortGuid project_id = 1;
}

message RemoveProjectResponse {}
