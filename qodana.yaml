#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"

#Specify the linter to run the analysis in a container (Applied in CI/CD pipeline)
#Qodana Community for .NET: the Qodana Cloud organization has a Community licence, which refuses Qodana for .NET,
#and the community linter runs only in its container, never natively
linter: jetbrains/qodana-cdnet:2026.1

#The solution to analyse; the repository holds other .slnx files (test fixtures, examples) that must not be picked
dotnet:
  solution: src/backend/EtAlii.Adp.slnx

#The community linter runs InspectCode, which takes its inspections from .editorconfig and .DotSettings: neither the
#profile below nor an include list changes what it finds. The list for Qodana in Rider is in src/backend/qodana.yaml
#Specify inspection profile for code analysis
profile:
  name: qodana.starter

#Disable inspections
#exclude:
#  - name: <SomeDisabledInspectionId>
#    paths:
#      - <path/where/not/run/inspection>

#Execute shell command before Qodana execution (Applied in CI/CD pipeline)
#The container's own .NET SDK is older than the one src/global.json names, and MSBuild refuses to load the solution
#without it, so the SDK global.json names is installed beside the container's own
bootstrap: curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh && bash /tmp/dotnet-install.sh --jsonfile src/global.json --install-dir "$(dirname "$(readlink -f "$(command -v dotnet)")")"

#Install IDE plugins before Qodana execution (Applied in CI/CD pipeline)
#plugins:
#  - id: <plugin.id> #(plugin id can be found at https://plugins.jetbrains.com)

# Quality gate. Will fail the CI/CD pipeline if any condition is not met
# severityThresholds - configures maximum thresholds for different problem severities
# testCoverageThresholds - configures minimum code coverage on a whole project and newly added code
# dependencyLicenses - fails the run on prohibited or unknown dependency licenses
# Code Coverage is available in Ultimate and Ultimate Plus plans
#failureConditions:
#  severityThresholds:
#    any: 15
#    critical: 5
#  testCoverageThresholds:
#    fresh: 70
#    total: 50
#  dependencyLicenses:
#    failOnProhibited: true
#    failOnUnknown: false
